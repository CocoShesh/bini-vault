<style id="hero-layout-final">
/* Navbar overlays the hero instead of pushing it away. */
.topbar{
  background:linear-gradient(
    180deg,
    rgba(4,5,8,.78) 0%,
    rgba(4,5,8,.30) 55%,
    transparent 100%
  ) !important;
}

.topbar.scrolled{
  background:rgba(6,7,10,.93) !important;
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:0 14px 42px rgba(0,0,0,.18);
}

/* Hero starts at the very top so its background sits behind the navbar. */
.hero{
  margin-top:0 !important;
  height:640px !important;
  overflow:hidden;
}

/* Content gets its own safe area below the navbar. */
.hero-inner{
  box-sizing:border-box !important;
  height:100% !important;
  padding:118px 30px 24px !important;
  align-items:flex-start !important;
}

.hero-copy{
  width:min(680px,56vw) !important;
  max-width:680px !important;
  min-width:0 !important;
}

/* Keep very long featured titles from hitting the navbar
   or consuming the entire hero. */
.hero h1{
  max-width:650px !important;
  font-size:clamp(38px,3.6vw,60px) !important;
  line-height:1.02 !important;
  letter-spacing:-.05em !important;
  display:-webkit-box !important;
  -webkit-box-orient:vertical !important;
  -webkit-line-clamp:3 !important;
  overflow:hidden !important;
}

.hero-meta{
  margin-top:14px !important;
}

.hero-desc{
  max-width:560px !important;
  -webkit-line-clamp:2 !important;
}

/* Make the non-scrolled state stay translucent.
   Only the scrolled state becomes solid. */
@media(min-width:761px){
  .topbar:not(.scrolled){
    box-shadow:none !important;
    backdrop-filter:none !important;
  }
}

@media(max-width:760px){
  .topbar{
    background:linear-gradient(
      180deg,
      rgba(4,5,8,.84) 0%,
      rgba(4,5,8,.42) 65%,
      transparent 100%
    ) !important;
  }

  .hero{
    margin-top:0 !important;
    height:550px !important;
  }

  .hero-inner{
    padding:96px 14px 38px !important;
    align-items:flex-start !important;
  }

  .hero-copy{
    width:100% !important;
    max-width:680px !important;
  }

  .hero h1{
    font-size:clamp(30px,8vw,44px) !important;
    -webkit-line-clamp:3 !important;
  }

  .hero-desc{
    -webkit-line-clamp:3 !important;
  }
}
</style>

</head>
