name: OpenAI API smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify OpenAI authentication and generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          def finish(message, success=False):
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
              sys.exit(0 if success else 1)

          key = os.environ.get('OPENAI_API_KEY', '').strip()
          if not key:
              finish('FAIL: Add repository Actions secret OPENAI_API_KEY, then run again.')

          payload = {
              'model': os.environ['OPENAI_MODEL'],
              'input': 'Reply with exactly OK.',
              'max_output_tokens': 32,
              'store': False,
          }
          request = urllib.request.Request(
              'https://api.openai.com/v1/responses',
              data=json.dumps(payload).encode(),
              headers={'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              hints = {
                  400: 'Request rejected; check model compatibility.',
                  401: 'Invalid or revoked key; replace the repository secret.',
                  403: 'Key or project lacks permission.',
                  404: 'Model unavailable for this project.',
                  429: 'Quota or rate limit reached; check API billing and limits.',
              }
              finish(f'FAIL: HTTP {error.code}. ' + hints.get(error.code, 'OpenAI service error; try later.'))
          except (urllib.error.URLError, TimeoutError):
              finish('FAIL: Network error or timeout contacting OpenAI.')
          except (ValueError, OSError):
              finish('FAIL: Could not read the API response.')

          text = ''.join(
              part.get('text', '')
              for item in result.get('output', [])
              for part in item.get('content', [])
              if part.get('type') == 'output_text'
          ).strip()
          if result.get('status') != 'completed' or text != 'OK':
              finish('FAIL: API replied, but did not complete the expected OK response.')
          finish('PASS: OpenAI authentication and gpt-4.1-mini generation work.', success=True)
          PY
